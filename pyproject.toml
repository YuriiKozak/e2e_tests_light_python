[project]
name = "e2e-tests-light"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "allure-pytest>=2.16.0",
    "allure-python-commons>=2.16.0",
    "certifi>=2026.7.22",
    "charset-normalizer>=3.5.1",
    "colorama>=0.4.6",
    "email-validator>=2.3.0",
    "faker>=40.37.0",
    "greenlet>=3.5.5",
    "idna>=3.19",
    "iniconfig>=2.3.0",
    "packaging>=26.3",
    "playwright>=1.62.0",
    "pluggy>=1.6.0",
    "pydantic>=2.13.4",
    "pyee>=13.0.1",
    "pygments>=2.21.0",
    "pytest>=9.1.1",
    "pytest-base-url>=2.1.0",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.9.0",
    "python-dotenv>=1.2.3",
    "python-slugify>=8.0.4",
    "requests>=2.34.2",
    "selenium>=4.47.0",
    "text-unidecode>=1.3",
    "typing-extensions>=4.16.0",
    "urllib3>=2.7.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "*_tests.py"]
python_functions = ["test_*"]
norecursedirs = [".git", ".venv", ".claude", "__pycache__", "build", "dist", "*.egg-info"]
addopts = [
    "-v",
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--headed",
    "--tracing=retain-on-failure",
    "--screenshot=on",
    "--output=test-result/traces/",
    "--html=test-result/report.html",
    "--self-contained-html",
    "--alluredir=test-result/allure-results"
]
markers = [
    "api: API Tests",
    "smoke: Smoke Tests",
    "regression: Regression Tests"
]
console_output_style = "progress"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "datamodel-code-generator>=0.68.1"
]

[tool.datamodel-codegen]
input = "./api-1.json"
output = "./src/api/models/models.py"
target-python-version = "3.14"
snake-case-field = true
field-constraints = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]
