name: E2E Tests

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'api'
        type: choice
        options:
          - api
          - smoke
          - regression

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

  api-tests:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.test_suite == 'api' || inputs.test_suite == 'all'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-playwright: true

      - name: Run api tests
        env:
          CI: true
          URL: ${{ secrets.URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TOKEN: ${{ secrets.TOKEN }}
        run: uv run pytest -m api --ignore=tests/web/selenium

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: test-result/allure-results/
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-traces
          path: test-result/traces/
          retention-days: 14

  publish-report:
    runs-on: ubuntu-latest
    needs: [ api-tests, smoke-tests, regression-tests ]
    if: always() && (needs.api-tests.result != 'skipped' ||
      needs.smoke-tests.result != 'skipped' ||
      needs.regression-tests.result != 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download  api Allure results
        if: needs.api-tests.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: api-allure-results
          path: allure-results/api

      - name: Download smoke Allure results
        if: needs.smoke-tests.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: smoke-allure-results
          path: allure-results/smoke

      - name: Download regression Allure results
        if: needs.regression-tests.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: regression-allure-results
          path: allure-results/regression

      - name: Install Allure CLI
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.36.0/allure-2.36.0.tgz | tar -xz
          echo "$PWD/allure-2.36.0/bin" >> $GITHUB_PATH

      - name: Generate Allure reports
        run: |
          if [ -d allure-results/api ]; then
            allure generate allure-results/api -o pages/allure/api --clean
          fi
          if [ -d allure-results/smoke ]; then
            allure generate allure-results/smoke -o pages/allure/smoke --clean
          fi
          if [ -d allure-results/regression ]; then
            allure generate allure-results/regression -o pages/allure/regression --clean
          fi

      - name: Prepare Pages content
        run: |
          mkdir -p pages
          if [ -f report/api/report.html ]; then
            cp report/api/report.html pages/index.html
          fi
          if [ -f report/smoke/report.html ]; then
            cp report/smoke/report.html pages/index.html
          fi
          if [ -f report/regression/report.html ]; then
            cp report/regression/report.html pages/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4